ktor {
  db {
    jdbcUrl = ${?DB_JDBC_URL}
    driver = ${?DB_DRIVER}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
    maximumPoolSize = ${?DB_POOL_SIZE}
  }

  jwt {
    secret = ${?JWT_SECRET}
    issuer = ${?JWT_ISSUER}
    audience = ${?JWT_AUDIENCE}
    realm = ${?JWT_REALM}
    expirySeconds = ${?JWT_EXPIRY}
  }

  deployment {
    port = ${?PORT}
    watch = [ classes ]
  }

  application {
    modules = [ org.montigny.client.ApplicationKt.module ]
  }
}

