services:
  api:
    build: .
    container_name: ktor_api
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 9090

      # DB settings: Use HOST machine Postgres
      DB_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/main_database
      DB_DRIVER: org.postgresql.Driver
      DB_USER: postgres
      DB_PASSWORD: password
      DB_POOL_SIZE: 10

      # JWT settings
      JWT_SECRET: a-very-long-secret-change-me
      JWT_ISSUER: com.example
      JWT_AUDIENCE: com.example.api
      JWT_REALM: Access to example
      JWT_EXPIRY: 604800