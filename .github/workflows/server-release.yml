name: Server CI & Release

on:
  push:
    branches:
      - serverRelease

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle-cache
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*','**/gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Show environment
        run: |
          java -version
          ./gradlew --version

      - name: Prepare temp directories
        run: |
          mkdir -p ${{ github.workspace }}/tmp/sqlite-natives
          echo "systemProp.java.io.tmpdir=${{ github.workspace }}/tmp" >> gradle.properties
          echo "systemProp.sqlite4java.library.path=${{ github.workspace }}/tmp/sqlite-natives" >> gradle.properties

      - name: Build project + server shadow JAR
        run: |
          ./gradlew --no-daemon --no-parallel clean build :server:shadowJarForServer

      - name: Find server artifact
        id: find-server-jar
        run: |
          echo "Searching for server shadow jar..."
          ls -la server/build/libs || true
          server_jar=$(ls server/build/libs/*all*.jar 2>/dev/null || ls server/build/libs/*.jar | head -n1)
          if [ -z "$server_jar" ]; then
            echo "No server JAR found"
            exit 1
          fi
          echo "server_jar=$server_jar" >> $GITHUB_OUTPUT
          echo "Found: $server_jar"

      - name: Make tag name
        id: tag
        run: |
          timestamp=$(date -u +"%Y%m%dT%H%M%SZ")
          TAG="release/server-${timestamp}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag will be $TAG"

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Server Release ${{ steps.tag.outputs.tag }}
          body: "Automated server release for branch serverRelease"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload server artifact to release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find-server-jar.outputs.server_jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
