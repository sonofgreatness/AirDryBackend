name: Server CI & Release

on:
  push:
    branches:
      - serverRelease

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Prepare temp directories for SQLDelight
        run: |
          mkdir -p ${{ github.workspace }}/tmp/sqlite-natives
          echo "systemProp.java.io.tmpdir=${{ github.workspace }}/tmp" >> gradle.properties
          echo "systemProp.sqlite4java.library.path=${{ github.workspace }}/tmp/sqlite-natives" >> gradle.properties

      # --- Optional frontend ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Clean install npm dependencies (React)
        working-directory: web/superuser-ui
        run: |
          rm -rf node_modules package-lock.json
          npm install --force --legacy-peer-deps

      - name: Build React frontend
        working-directory: web/superuser-ui
        run: npm run build

      # --- Build server ---
      - name: Build project + server fat JAR
        run: |
          ./gradlew --no-daemon --no-parallel clean build :server:shadowJarForServer

      - name: Find server fat JAR
        id: find-server-jar
        run: |
          server_jar=$(ls server/build/libs/*all*.jar 2>/dev/null | head -n1)
          if [ -z "$server_jar" ]; then
            echo "No server fat JAR found"
            exit 1
          fi
          echo "server_jar=$server_jar" >> $GITHUB_OUTPUT
          echo "Found server fat JAR: $server_jar"

      # --- Tagging ---
      - name: Generate semantic version tag
        id: tag
        run: |
          LAST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            MAJOR=$(echo $LAST_TAG | cut -d. -f1 | sed 's/v//')
            MINOR=$(echo $LAST_TAG | cut -d. -f2)
            PATCH=$(echo $LAST_TAG | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          fi
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Generated semantic version tag: $NEW_TAG"

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

      # --- Release ---
      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Server Release ${{ steps.tag.outputs.tag }}
          body: "Automated server release for branch serverRelease"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload server fat JAR to release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.find-server-jar.outputs.server_jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
