name: Desktop CI & Release

on:
  push:
    branches:
      - deskTopRelease

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}\.gradle-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      - name: Prepare temp directories
        shell: pwsh
        run: |
          $tmp = "$env:GITHUB_WORKSPACE\tmp"
          $sqlite = "$tmp\sqlite-natives"
          New-Item -ItemType Directory -Force -Path $sqlite | Out-Null
          Add-Content gradle.properties "systemProp.java.io.tmpdir=$tmp"
          Add-Content gradle.properties "systemProp.sqlite4java.library.path=$sqlite"

      - name: Build project and package distributables
        run: |
          ./gradlew --no-daemon --no-parallel clean build :composeApp:packageDistributionForCurrentOS --stacktrace
        shell: bash

      - name: Locate distributables (JAR, EXE, MSI)
        id: find-artifacts
        shell: bash
        run: |
          SHADOWJAR=$(find composeApp/build/libs -name "*all*.jar" -o -name "*.jar" | head -n 1 || true)
          EXE=$(find composeApp/build/compose -name "*.exe" | head -n 1 || true)
          MSI=$(find composeApp/build/compose -name "*.msi" | head -n 1 || true)
          echo "shadowjar=$SHADOWJAR" >> $GITHUB_OUTPUT
          echo "exe=$EXE" >> $GITHUB_OUTPUT
          echo "msi=$MSI" >> $GITHUB_OUTPUT

      - name: Generate release tag
        id: tag
        shell: pwsh
        run: |
          $timestamp = (Get-Date).ToString("yyyyMMddTHHmmssZ")
          $tag = "release/desktop-$timestamp"
          echo "tag=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding ASCII

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "Desktop Release ${{ env.tag }}"
          body: "Automated Compose Desktop build for deskTopRelease branch. Includes Windows executables and fat JAR."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload built artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-artifacts.outputs.shadowjar }}
            ${{ steps.find-artifacts.outputs.exe }}
            ${{ steps.find-artifacts.outputs.msi }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
