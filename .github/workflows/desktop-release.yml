name: Desktop CI & Release

on:
  push:
    branches:
      - deskTopRelease

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}\.gradle-cache

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        shell: pwsh

      # Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Install SQLite native DLLs
      - name: Install SQLite native libraries
        shell: pwsh
        run: |
          Write-Host "Downloading SQLite native libraries..."
          $sqliteDir = "$env:GITHUB_WORKSPACE\sqlite-natives"
          New-Item -ItemType Directory -Force -Path $sqliteDir | Out-Null

          $dllZip = "sqlite-dll-win-x64-3500400.zip"
          $url = "https://www.sqlite.org/2025/$dllZip"
          Write-Host "Downloading from $url"
          Invoke-WebRequest -Uri $url -OutFile "$sqliteDir\sqlite.zip"

          Expand-Archive -Path "$sqliteDir\sqlite.zip" -DestinationPath $sqliteDir -Force
          Write-Host "✅ SQLite native DLLs installed at $sqliteDir"

          Add-Content -Path "gradle.properties" -Value "systemProp.sqlite4java.library.path=$sqliteDir"
          Add-Content -Path "gradle.properties" -Value "systemProp.java.io.tmpdir=$sqliteDir"

      # Build Desktop project (skip migration verification)
      - name: Build project and package distributables
        run: ./gradlew --no-daemon --no-parallel clean build :composeApp:packageDistributionForCurrentOS :composeApp:shadowJar -x composeApp:verifyCommonMainAppDatabaseMigration --stacktrace
        shell: pwsh

      # Locate artifacts
      - name: Locate distributables (JAR, EXE, MSI)
        id: find-artifacts
        shell: pwsh
        run: |
          $shadowJar = Get-ChildItem -Path "composeApp/build/libs" -Filter "*all*.jar" -Recurse | Select-Object -First 1
          $exe = Get-ChildItem -Path "composeApp/build/compose" -Filter "*.exe" -Recurse | Select-Object -First 1
          $msi = Get-ChildItem -Path "composeApp/build/compose" -Filter "*.msi" -Recurse | Select-Object -First 1
          echo "shadowjar=$($shadowJar.FullName)" >> $env:GITHUB_OUTPUT
          echo "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "✅ Located artifacts:"
          Write-Host "  JAR: $($shadowJar.FullName)"
          Write-Host "  EXE: $($exe.FullName)"
          Write-Host "  MSI: $($msi.FullName)"

      # Generate semantic version tag
      - name: Generate semantic version tag
        id: tag
        shell: pwsh
        run: |
          $lastTag = (git tag -l "v*" | Sort-Object -Descending | Select-Object -First 1)
          if (-not $lastTag) {
            $newTag = "v1.0.0"
          } else {
            $parts = $lastTag -replace "v","" -split "\."
            $major = [int]$parts[0]
            $minor = [int]$parts[1]
            $patch = [int]$parts[2] + 1
            $newTag = "v$major.$minor.$patch"
          }
          echo "tag=$newTag" >> $env:GITHUB_OUTPUT
          Write-Host "Generated tag: $newTag"

      # Create and push Git tag
      - name: Create and push Git tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $env:GITHUB_OUTPUT_tag
          git push origin $env:GITHUB_OUTPUT_tag

      # Create GitHub Release and upload artifacts
      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Desktop Release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated Compose Desktop build for **deskTopRelease** branch.

            Includes:
            - Windows **EXE** installer  
            - Windows **MSI** package  
            - Cross-platform **fat JAR**
          files: |
            ${{ steps.find-artifacts.outputs.shadowjar }}
            ${{ steps.find-artifacts.outputs.exe }}
            ${{ steps.find-artifacts.outputs.msi }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
